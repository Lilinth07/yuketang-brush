<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨课堂刷课器</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --text: #e6e8ee;
    --dim: #8b93a7;
    --accent: #4c8dff;
    --green: #38b26b;
    --red: #e2504c;
    --yellow: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 40px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 19px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .badge {
    margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
  }
  .badge.on { color: var(--green); border-color: #23492f; }
  .badge.off { color: var(--red); border-color: #4a2523; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 16px;
  }
  .course { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .course .name { font-size: 16px; font-weight: 600; }
  .course .meta { color: var(--dim); font-size: 12px; }

  .bar { height: 10px; background: #222735; border-radius: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#3f7ff0,#38b26b); width: 0; transition: width .4s; }
  .barline { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    font: inherit; color: var(--text); background: #232936; border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { background: #2c3444; border-color: #3d4759; }
  button.primary { background: #2a4d8f; border-color: #3560ad; }
  button.primary:hover:not(:disabled) { background: #315aa8; }
  button.danger { background: #4a2422; border-color: #6b332f; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .row label { width: 84px; color: var(--dim); font-size: 13px; flex: none; }
  input[type=text], input[type=password] {
    flex: 1; font: inherit; color: var(--text); background: #12151b;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  input:focus { outline: none; border-color: var(--accent); }

  #log {
    background: #0b0d11; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; height: 380px; overflow-y: auto; margin: 0;
    font: 12.5px/1.65 "Cascadia Mono", Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; color: #c9d1e0;
  }
  #log .ok { color: var(--green); }
  #log .err { color: var(--red); }
  #log .warn { color: var(--yellow); }
  #log .dim { color: var(--dim); }

  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; }
  .dot.busy { background: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>雨课堂刷课器</h1>
    <span class="sub">本地界面 · 只监听 127.0.0.1</span>
    <span id="badge" class="badge">加载中…</span>
  </header>

  <div class="card">
    <div class="course">
      <span id="courseName" class="name">—</span>
      <span id="courseMeta" class="meta"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="barline">
      <span id="progressText">—</span>
      <span id="scoreText"></span>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <button class="primary" data-task="video">刷视频</button>
      <button class="primary" data-task="video-exam">视频 + 作业</button>
      <button data-task="exam-auto">AI 答题并提交</button>
      <button data-task="exam-submit">提交已有答案</button>
      <button data-task="exam-list">作业列表</button>
      <button data-task="verify">复核完成度</button>
      <button data-task="llm-check">AI 连通测试</button>
      <button class="danger" id="stopBtn" disabled>停止</button>
    </div>
    <div class="hint">
      导出某份题目用命令行：<code>npm run exam -- --leaf &lt;ID&gt;</code>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label>端点</label>
      <input type="text" id="baseUrl" placeholder="https://api.deepseek.com/v1">
    </div>
    <div class="row">
      <label>模型</label>
      <input type="text" id="model" placeholder="deepseek-chat">
    </div>
    <div class="row">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
      <button id="saveLlm">保存</button>
    </div>
    <div class="hint">DeepSeek 官方可用：<code>deepseek-chat</code> / <code>deepseek-reasoner</code>。</div>
  </div>

  <div class="card" style="padding:0;background:transparent;border:0">
    <pre id="log"></pre>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
let busy = false;

function addLog(line) {
  const d = document.createElement('div');
  let cls = '';
  if (/✓|成功|完成|已提交|连通正常/.test(line)) cls = 'ok';
  else if (/✗|失败|错误|Error|错误/.test(line)) cls = 'err';
  else if (/^!|注意|跳过|警告/.test(line)) cls = 'warn';
  else if (/^›|^  /.test(line)) cls = 'dim';
  d.className = cls;
  d.textContent = line;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function setBusy(v, name) {
  busy = v;
  $('stopBtn').disabled = !v;
  document.querySelectorAll('button[data-task]').forEach((b) => (b.disabled = v));
  const badge = $('badge');
  if (v) {
    badge.className = 'badge';
    badge.innerHTML = '<span class="dot busy"></span>' + (name || '执行中');
  } else {
    refresh();
  }
}

async function refresh() {
  try {
    const s = await (await fetch('/api/status')).json();
    const badge = $('badge');
    badge.className = 'badge ' + (s.loggedIn ? 'on' : 'off');
    badge.textContent = s.loggedIn ? '已登录' : '未登录';

    if (s.course) {
      $('courseName').textContent = s.course.name;
      $('courseMeta').textContent = `视频 ${s.course.videoCount || '?'} 个 · 课程 ${s.course.classroomId}`;
    }
    if (s.stat) {
      const pct = s.stat.total ? (s.stat.done / s.stat.total) * 100 : 0;
      $('bar').style.width = pct.toFixed(1) + '%';
      $('progressText').textContent = `${s.stat.done}/${s.stat.total} · ${pct.toFixed(0)}%`;
      $('scoreText').textContent = `得分 ${s.stat.score ?? '-'} · 未完成 ${s.stat.unfinished ?? '-'} 项`;
    } else {
      $('progressText').textContent = '进度读取失败（登录态可能过期）';
    }

    if (!$('baseUrl').value) $('baseUrl').value = s.ai.baseUrl;
    if (!$('model').value) $('model').value = s.ai.model;
    if (!$('apiKey').value) $('apiKey').placeholder = s.ai.configured ? `已配置 · ${s.ai.model}` : 'sk-...';

    if (s.running) setBusy(true, s.running.name);
  } catch (e) {
    $('badge').textContent = '连接失败';
  }
}

document.querySelectorAll('button[data-task]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const task = btn.dataset.task;
    const r = await fetch('/api/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ task }),
    }).then((x) => x.json());
    if (!r.ok) addLog('✗ ' + r.error);
  });
});

$('stopBtn').addEventListener('click', async () => {
  await fetch('/api/stop', { method: 'POST' });
  addLog('! 已请求停止');
});

$('saveLlm').addEventListener('click', async () => {
  const r = await fetch('/api/llm', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      baseUrl: $('baseUrl').value.trim(),
      model: $('model').value.trim(),
      apiKey: $('apiKey').value.trim(),
    }),
  }).then((x) => x.json());
  addLog(r.ok ? '✓ AI 配置已保存' : '✗ 保存失败');
  $('apiKey').value = '';
  refresh();
});

const es = new EventSource('/events');
es.addEventListener('start', (e) => {
  const d = JSON.parse(e.data);
  addLog('━━ ' + d.name + ' ━━');
  setBusy(true, d.name);
});
es.addEventListener('log', (e) => addLog(JSON.parse(e.data).line));
es.addEventListener('done', (e) => {
  const d = JSON.parse(e.data);
  addLog(d.code === 0 ? '✓ 任务结束' : `✗ 任务结束，退出码 ${d.code}`);
  setBusy(false);
});

addLog('界面已就绪');
refresh();
setInterval(() => { if (!busy) refresh(); }, 15000);
</script>
</body>
</html>
